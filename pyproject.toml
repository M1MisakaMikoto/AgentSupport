[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsupport"
version = "0.2.0"
description = "Self-hosted agent execution and orchestration service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]
observability = [
  "opentelemetry-api>=1.24,<2",
  "opentelemetry-sdk>=1.24,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-instrumentation-httpx>=0.49b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1",
]
distributed = [
  "alembic>=1.13,<2",
  "redis>=5,<6",
]
trae = [
  "anthropic>=0.54.0,<=0.60.0",
  "asyncclick>=8.0.0",
  "click>=8.0.0",
  "docker>=7.1.0",
  "google-genai>=1.24.0",
  "jsonpath-ng>=1.7.0",
  "mcp==1.12.2",
  "ollama>=0.5.1",
  "openai>=1.86.0",
  "pexpect>=4.9.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.2",
  "rich>=13.0.0",
  "socksio>=1.0.0",
  "textual>=0.50.0",
  "tree-sitter==0.21.3",
  "tree-sitter-languages==1.10.2",
  "typing-extensions>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentsupport*", "agent_runner_contracts*", "session_runner*"]

[tool.setuptools.package-data]
agentsupport = ["serving/http/static/debug/*"]
session_runner = ["trae_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
