[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform"
version = "0.1.0"
description = "API-first agent platform foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]
trae = [
  "anthropic>=0.54.0,<=0.60.0",
  "asyncclick>=8.0.0",
  "click>=8.0.0",
  "docker>=7.1.0",
  "google-genai>=1.24.0",
  "jsonpath-ng>=1.7.0",
  "mcp==1.12.2",
  "ollama>=0.5.1",
  "openai>=1.86.0",
  "pexpect>=4.9.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.2",
  "rich>=13.0.0",
  "socksio>=1.0.0",
  "textual>=0.50.0",
  "tree-sitter==0.21.3",
  "tree-sitter-languages==1.10.2",
  "typing-extensions>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["agent_platform*", "session_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
