global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agentsupport
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: session-runner
    metrics_path: /metrics
    static_configs:
      - targets: ["runner:8080"]
