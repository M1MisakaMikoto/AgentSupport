apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-platform-worker
  namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-platform-runtime-manager
  namespace: agent-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-platform-runtime-manager
  namespace: agent-platform
subjects:
  - kind: ServiceAccount
    name: agent-platform-worker
    namespace: agent-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-platform-runtime-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-config
  namespace: agent-platform
data:
  AGENT_PLATFORM_PERSISTENCE_MODE: postgres
  AGENT_PLATFORM_AUTO_CREATE_SCHEMA: "false"
  AGENT_PLATFORM_EXECUTION_MODE: distributed
  AGENT_PLATFORM_RUNTIME_DRIVER: kubernetes
  AGENT_PLATFORM_KUBERNETES_NAMESPACE: agent-platform
  AGENT_PLATFORM_RUNNER_IMAGE: agent-session:dev
  AGENT_PLATFORM_KUBERNETES_RUNNER_SECRET_NAME: agent-runner-secrets
  AGENT_PLATFORM_MAX_ACTIVE_SESSIONS: "100"
  AGENT_PLATFORM_REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {tcpSocket: {port: redis}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agent-platform
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-api
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: agent-platform-api}
  template:
    metadata:
      labels: {app: agent-platform-api}
    spec:
      containers:
        - name: api
          image: agentsupport-api:latest
          command: ["uvicorn", "agent_platform.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef: {name: agent-platform-config}
            - secretRef: {name: agent-platform-secrets}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-platform-api
  namespace: agent-platform
spec:
  selector: {app: agent-platform-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-worker
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: agent-platform-worker}
  template:
    metadata:
      labels: {app: agent-platform-worker}
    spec:
      serviceAccountName: agent-platform-worker
      containers:
        - name: worker
          image: agentsupport-api:latest
          command: ["python", "-m", "agent_platform.worker"]
          envFrom:
            - configMapRef: {name: agent-platform-config}
            - secretRef: {name: agent-platform-secrets}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-event-publisher
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: agent-platform-event-publisher}
  template:
    metadata:
      labels: {app: agent-platform-event-publisher}
    spec:
      containers:
        - name: publisher
          image: agentsupport-api:latest
          command: ["python", "-m", "agent_platform.event_publisher"]
          envFrom:
            - configMapRef: {name: agent-platform-config}
            - secretRef: {name: agent-platform-secrets}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-reconciler
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: agent-platform-reconciler}
  template:
    metadata:
      labels: {app: agent-platform-reconciler}
    spec:
      serviceAccountName: agent-platform-worker
      containers:
        - name: reconciler
          image: agentsupport-api:latest
          command: ["python", "-m", "agent_platform.reconciler"]
          envFrom:
            - configMapRef: {name: agent-platform-config}
            - secretRef: {name: agent-platform-secrets}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-platform-api
  namespace: agent-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-platform-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-platform-internal-ingress
  namespace: agent-platform
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/managed-by
        operator: In
        values: [agent-platform]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-internal-ingress
  namespace: agent-platform
spec:
  podSelector:
    matchLabels: {app: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 6379}
