apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agentsupport-worker
  namespace: agentsupport
spec:
  scaleTargetRef:
    name: agentsupport-worker
  pollingInterval: 5
  cooldownPeriod: 60
  minReplicaCount: 2
  maxReplicaCount: 50
  triggers:
    - type: postgresql
      metadata:
        connectionFromEnv: AGENTSUPPORT_DATABASE_URL
        query: >-
          SELECT COUNT(*) FROM execution_jobs
          WHERE state IN ('READY', 'RETRY') AND available_at <= NOW()
        targetQueryValue: "1"
