apiVersion: batch/v1
kind: Job
metadata:
  name: agentsupport-db-migrate
  namespace: agentsupport
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: agentsupport-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: {name: agentsupport-secrets}
