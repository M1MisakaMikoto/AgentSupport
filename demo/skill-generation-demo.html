<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentSupport · Skill 对话演示</title>
<style>
  :root{--bg:#0b1020;--panel:#121a2e;--panel2:#0e1526;--line:#243356;--text:#e8edf7;--muted:#93a1c3;--accent:#4f8cff;--accent2:#22d3a5;--warn:#f5b544;--danger:#f87171;--code:#0a0f1e}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{background:rgba(11,16,32,.94);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{font-weight:700}.brand span{color:var(--accent2)}
  .conn{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--danger);display:inline-block}
  .dot.on{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px}
  .chip{border:1px solid var(--line);border-radius:99px;padding:4px 13px;font-size:12.5px;color:var(--muted);cursor:pointer;background:var(--panel2)}
  .chip:hover{border-color:var(--accent);color:var(--text)}
  #chat{flex:1;overflow-y:auto;padding:20px 18px 10px;scroll-behavior:smooth}
  .inner{max-width:900px;margin:0 auto}
  .msg{display:flex;margin-bottom:14px}
  .bubble{max-width:78%;border-radius:14px;padding:11px 15px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .user{justify-content:flex-end}
  .user .bubble{background:rgba(79,140,255,.16);border:1px solid rgba(79,140,255,.4)}
  .agent .bubble{background:var(--panel);border:1px solid var(--line)}
  .sys{justify-content:center}
  .sys .bubble{background:transparent;color:var(--muted);font-size:12.5px;border:none;padding:3px 8px;text-align:center}
  .who{font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .user .who{text-align:right}
  pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:12.5px;line-height:1.5;margin-top:8px;white-space:pre-wrap;word-break:break-word}
  code{font-family:Consolas,"Courier New",monospace}
  .usage{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
  .usage span{font-size:11.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 9px}
  .usage b{color:var(--accent2)}
  .approve-line{display:inline-flex;gap:8px;align-items:center;margin-top:6px}
  button.approve{background:rgba(34,211,165,.12);color:var(--accent2);border:1px solid rgba(34,211,165,.45);border-radius:8px;padding:4px 12px;font-size:12.5px;cursor:pointer}
  button.approve:hover{border-color:var(--accent2)}
  .summary-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .steps{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}
  .step{flex:1;min-width:110px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12px;color:var(--muted);text-align:center}
  .step.on{border-color:var(--accent2);color:var(--accent2)}
  .step.done{background:rgba(34,211,165,.1);border-color:var(--accent2);color:var(--accent2)}
  .path{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--accent2);word-break:break-all;margin:8px 0}
  .hint{color:var(--muted);font-size:12.5px}
  footer{border-top:1px solid var(--line);background:rgba(11,16,32,.96);padding:10px 18px 14px}
  .f-inner{max-width:900px;margin:0 auto}
  .send-row{display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;min-height:52px;max-height:140px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;resize:none;font-family:inherit}
  textarea:focus{outline:none;border-color:var(--accent)}
  .send,.sum{height:52px;border-radius:12px;font-size:14px;cursor:pointer;padding:0 20px;white-space:nowrap}
  .send{background:var(--accent);color:#fff;border:none}
  .send:disabled{opacity:.4;cursor:not-allowed}
  .sum{background:var(--panel2);color:var(--accent2);border:1px solid var(--accent2)}
  .sum:disabled{opacity:.4;cursor:not-allowed}
  .sum.running{color:var(--warn);border-color:var(--warn)}
  .opts{display:flex;align-items:center;gap:16px;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
  .opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
  .opts input{accent-color:var(--accent2)}

.overlay{position:fixed;inset:0;background:rgba(4,8,20,.72);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(860px,92vw);max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal-body{overflow-y:auto;padding:10px 16px 16px}
.hist-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;background:var(--panel2)}
.hist-item:hover{border-color:var(--accent)}
.hist-detail{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:2px 0 10px;background:rgba(79,140,255,.05)}
.hist-round{border-left:2px solid var(--line);padding:4px 10px;margin:8px 0}
.hist-msg{white-space:pre-wrap;font-size:13px;color:var(--text);margin:3px 0}
.skill-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.skill-opt{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer;background:var(--panel2);color:var(--muted)}
.skill-opt input{accent-color:var(--accent2)}
.skill-opt.on{border-color:var(--accent2);color:var(--accent2)}
</style>
</head>
<body>

<header>
  <div class="brand">AgentSupport <span>Skill 对话演示</span></div>
  <div class="conn"><span class="dot" id="dot"></span><span id="connText">未连接</span><button class="chip" id="btnHistory" onclick="openHistory()">历史会话</button></div>
</header>

<div class="chips" id="chips">
  <span class="chip" data-task="你是独立开发者。在 workspace 用文件编辑工具创建 calc.py：实现 add/sub/mul/div 四个函数（除零抛 ValueError），并写 3 个断言调用。禁止 bash；完成后 task_done。">示例：计算器工具</span>
  <span class="chip" data-task="你是独立开发者。在 workspace 用文件编辑工具创建 todo.py：实现 add_task/complete_task/list_tasks 的内存待办清单，并写 3 个断言。禁止 bash；完成后 task_done。">示例：待办清单</span>
  <span class="chip" data-task="你是独立开发者。修复 D:\workspace\shop.py 中的 N+1 查询：list_orders() 循环内逐行查询用户。请用批量查询+内存回填修复，并加查询次数断言。禁止 bash；完成后 task_done。">示例：修复 N+1</span>
</div>

<div id="chat"><div class="inner" id="inner"></div></div>

<footer>
  <div class="f-inner">
    <div class="opts">
      <label><input type="checkbox" id="autoApprove" checked> 工具审批自动放行</label>
      <span class="hint">直接输入指令与 agent 对话；跑通后点「总结成 Skill」。</span>
      <div class="skill-opts" id="skillOpts"></div>
    </div>
    <div class="send-row">
      <textarea id="input" placeholder="给 agent 下指令，例如：在 workspace 创建一个 markdown 转 HTML 的小工具，并写断言…"></textarea>
      <button class="send" id="btnSend">发送</button>
      <button class="sum" id="btnSum">总结成 Skill</button>
    </div>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const inner = $("inner");
let state = { status: "idle" };
let started = false;
let selectedSkills = new Set();
let historyOpen = false;

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function log(){}

function bubble(cls, who, html){ inner.insertAdjacentHTML("beforeend", `<div class="msg ${cls}"><div style="max-width:78%"><div class="who">${who}</div><div class="bubble">${html}</div></div></div>`); }
function sys(text){ inner.insertAdjacentHTML("beforeend", `<div class="msg sys"><div class="bubble">${esc(text)}</div></div>`); }

function renderMessages(){
  const prev = inner.scrollHeight;
  inner.innerHTML = "";
  if (!started){
    inner.insertAdjacentHTML("beforeend", `<div class="msg sys"><div class="bubble">👋 这是 AgentSupport 的 Skill 对话演示。输入指令让 agent 干活，agent 会真实执行（文件编辑需审批放行）；跑通后点「总结成 Skill」，系统会把这次对话沉淀为标准 SKILL.md 并入库。</div></div>`);
  } else {
    sys("会话已创建：" + (state.session_id||"").slice(0,8) + " · 现在你可以给 agent 下指令");
    for (const a of state.approvals||[]){
      sys("✅ 导师放行工具：" + (a.tools||[]).join(", "));
    }
    (state.rounds||[]).forEach((r, i) => {
      if (r.task) bubble("user", "测试者", esc(r.task));
      for (const t of r.tool_calls||[]) sys("🔧 工具调用：" + t);
      if (r.message) bubble("agent", "Agent", esc(r.message));
      if (r.usage){
        sys(`第 ${i+1} 轮完成 · input ${r.usage.input_tokens} / output ${r.usage.output_tokens}`);
      }
    });
  }
  if (state.pending_approval && state.auto_approve === false){
    inner.insertAdjacentHTML("beforeend",
      `<div class="msg sys"><div class="bubble"><div class="approve-line">⏳ agent 请求编辑权限（${esc((state.pending_approval.tools||[]).join(", "))}）
      <button class="approve" onclick="approveTool()">批准</button></div></div></div>`);
  }
  if (state.summary){
    renderSummary(state.summary);
  }
  inner.scrollTop = inner.scrollHeight - inner.clientHeight > 0 ? inner.scrollHeight : 0;
}

const STEPS = ["analyzing","generating","validating","done"];
const STEP_LABEL = {starting:"准备中",analyzing:"① 分析会话历史",generating:"② Agent 正在生成 SKILL.md",validating:"③ 校验并入库",done:"④ 完成",failed:"总结失败"};

function renderSummary(s){
  const panel = document.createElement("div");
  panel.className = "summary-panel";
  if (s.status === "running"){
    const idx = STEPS.indexOf(s.progress);
    const steps = STEPS.map((k,i)=>`<div class="step ${i<idx?"done":(i===idx?"on":"")}">${STEP_LABEL[k]}</div>`).join("");
    panel.innerHTML = `<div style="font-weight:700">总结成 Skill 中…</div><div class="steps">${steps}</div><div class="hint">${STEP_LABEL[s.progress]||s.progress}</div>`;
  } else if (s.status === "completed"){
    const u = s.usage||{};
    panel.innerHTML = `
      <div style="font-weight:700;color:var(--accent2)">✅ 总结完成，已入库</div>
      <div class="usage"><span>skill：<b>${esc(s.skill_id)}</b></span><span>input <b>${u.input_tokens||"—"}</b></span><span>output <b>${u.output_tokens||"—"}</b></span></div>
      <div class="path">📄 ${esc(s.file_path)}</div>
      <pre>${esc(s.content)}</pre>
      <div class="hint">该文件已按租户隔离发布到 skill 库，新会话勾选即可注入使用。</div>`;
  } else {
    panel.innerHTML = `<div style="font-weight:700;color:var(--danger)">总结失败：${esc(s.error||"未知错误")}</div><div class="hint">可以再追加一轮指令后重试。</div>`;
  }
  inner.appendChild(panel);
  inner.scrollTop = inner.scrollHeight;
}

async function api(path, body){
  const resp = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  if(!resp.ok){ const t = await resp.text(); throw new Error(t.slice(0,200)); }
  return resp.json();
}

function startBody(){
  return {auto_approve:$("autoApprove").checked, skills:[...selectedSkills]};
}

async function loadSkills(){
  try{
    const resp = await fetch("/api/skills");
    if(!resp.ok) return;
    const list = await resp.json();
    const box = $("skillOpts");
    if(list.length){
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = "新会话启用 Skill：";
      box.appendChild(hint);
      list.forEach(s => {
        const label = document.createElement("label");
        label.className = "skill-opt";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.onchange = () => {
          if(cb.checked) selectedSkills.add(s.skill_id); else selectedSkills.delete(s.skill_id);
          label.classList.toggle("on", cb.checked);
        };
        label.appendChild(cb);
        label.appendChild(document.createTextNode(" " + (s.name || s.skill_id)));
        box.appendChild(label);
      });
    }
  }catch(e){}
}

function openHistory(){
  historyOpen = true;
  $("historyOverlay").style.display = "flex";
  const list = $("historyList");
  list.innerHTML = '<div class="hint">加载中…</div>';
  fetch("/api/history").then(r=>r.json()).then(renderHistory).catch(e=>{ list.innerHTML = '<div class="hint">加载失败：' + esc(e.message) + '</div>'; });
}
function closeHistory(){ historyOpen = false; $("historyOverlay").style.display = "none"; }

function renderHistory(sessions){
  const list = $("historyList");
  if(!sessions.length){ list.innerHTML = '<div class="hint">还没有历史会话。</div>'; return; }
  list.innerHTML = "";
  sessions.slice().reverse().forEach(s => {
    const div = document.createElement("div");
    div.className = "hist-item";
    div.onclick = () => toggleHistoryDetail(div, s.session_id);
    const rounds = s.rounds || [];
    div.innerHTML = '<b>' + esc(s.name) + '</b> <span class="hint">· ' + rounds.length + ' 轮 · ' + esc(s.created_at || "") + '</span>';
    list.appendChild(div);
  });
}

async function toggleHistoryDetail(div, sessionId){
  const existing = div.nextElementSibling;
  if(existing && existing.classList.contains("hist-detail")){ existing.remove(); return; }
  const detail = document.createElement("div");
  detail.className = "hist-detail";
  detail.innerHTML = '<div class="hint">加载中…</div>';
  div.after(detail);
  try{
    const resp = await fetch("/api/history/" + sessionId);
    const s = await resp.json();
    let html = "";
    (s.rounds||[]).forEach(r => {
      html += '<div class="hist-round"><div class="hist-msg"><b>测试者：</b>' + esc(r.task || "") + '</div>';
      if(r.message) html += '<div class="hist-msg"><b>Agent：</b>' + esc(r.message) + '</div>';
      if(r.usage) html += '<div class="hint">' + (r.conversation_id||"").slice(0,8) + ' · input ' + (r.usage.input_tokens||"—") + ' / output ' + (r.usage.output_tokens||"—") + '</div>';
      html += '</div>';
    });
    detail.innerHTML = html || '<div class="hint">该会话暂无轮次。</div>';
  }catch(e){ detail.innerHTML = '<div class="hint">加载失败：' + esc(e.message) + '</div>'; }
}

$("btnSend").onclick = send;
$("input").addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { $("input").value = c.dataset.task; $("input").focus(); });

async function send(){
  const task = $("input").value.trim();
  if(!task) return;
  $("input").value = "";
  try{
    if(!started){
      state = await api("/api/start", startBody());
      started = true;
    }
    renderMessages();
    sys("⏳ Agent 执行中…");
    await api("/api/round",{task});
  }catch(e){ sys("发送失败：" + e.message); }
  await poll(true);
}

function approveTool(){
  api("/api/approve-tool").then(()=>poll(true)).catch(e=>sys("批准失败："+e.message));
}

$("btnSum").onclick = async () => {
  if(!started){ state = await api("/api/start", startBody()); started = true; renderMessages(); }
  try{
    $("btnSum").disabled = true; $("btnSum").classList.add("running");
    await api("/api/summarize");
    await poll(true);
  }catch(e){ sys("总结失败："+e.message); }
};

async function poll(force){
  try{
    const resp = await fetch("/api/state");
    if(resp.ok){
      state = await resp.json();
      $("dot").className = "dot" + (state.session_id ? " on" : "");
      $("connText").textContent = state.session_id ? ("会话 " + state.session_id.slice(0,8) + " · " + state.status + ((state.active_skills&&state.active_skills.length) ? " · Skill: " + state.active_skills.join(", ") : "")) : "已连接";
      $("btnSend").disabled = state.status === "running_round" || state.status === "running_generate";
      const summarizing = state.summary && state.summary.status === "running";
      $("btnSum").disabled = !started || summarizing || (state.rounds||[]).length === 0;
      $("btnSum").classList.toggle("running", summarizing);
      renderMessages();
      if(summarizing || state.status === "running_round" || state.status === "running_generate") setTimeout(()=>poll(), 1500);
      else if(force) setTimeout(()=>poll(), 1500);
    } else {
      $("dot").className = "dot"; $("connText").textContent = "未连接编排服务";
    }
  }catch(e){
    $("dot").className = "dot"; $("connText").textContent = "未连接编排服务";
  }
}
renderMessages();
poll();
loadSkills();
</script>

<div class="overlay" id="historyOverlay" style="display:none" onclick="if(event.target===this)closeHistory()">
  <div class="modal">
    <div class="modal-head"><b>历史会话</b><button class="chip" onclick="closeHistory()">关闭</button></div>
    <div class="modal-body" id="historyList"></div>
  </div>
</div>
</body>
</html>
