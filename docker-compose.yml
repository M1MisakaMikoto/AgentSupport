services:
  db-migrate:
    image: agentsupport-api
    command: alembic upgrade head
    environment:
      AGENTSUPPORT_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agentsupport
    depends_on:
      postgres:
        condition: service_healthy

  workspace-init:
    image: agentsupport-api
    user: root
    command: ["sh", "-c", "mkdir -p /workspace-data /app/src/skills && chown -R agent:agent /workspace-data /app/src/skills"]
    volumes:
      - workspace-data:/workspace-data
      - skills-data:/app/src/skills
    restart: "no"

  api:
    image: agentsupport-api
    build: .
    restart: unless-stopped
    command: uvicorn agentsupport.main:app --host 0.0.0.0 --port 8000
    environment:
      AGENTSUPPORT_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agentsupport
      AGENTSUPPORT_PERSISTENCE_MODE: postgres
      AGENTSUPPORT_AUTO_CREATE_SCHEMA: "false"
      AGENTSUPPORT_EXECUTION_MODE: temporal
      AGENTSUPPORT_TEMPORAL_HOST: temporal:7233
      AGENTSUPPORT_TEMPORAL_NAMESPACE: default
      AGENTSUPPORT_TEMPORAL_TASK_QUEUE: agentsupport
      AGENTSUPPORT_REDIS_URL: redis://redis:6379/0
      AGENTSUPPORT_CORE_RUNNER_URL: http://runner:8080
      AGENTSUPPORT_CORE_RUNNER_TIMEOUT_SECONDS: 300
      AGENTSUPPORT_CORE_RUNNER_WORKSPACE_ROOT: /workspace-data
      AGENTSUPPORT_WORKSPACE_ROOT: /workspace-data
      AGENTSUPPORT_RUNNER_TOKEN: ${AGENTSUPPORT_RUNNER_TOKEN:-}
      AGENTSUPPORT_RUNNER_HEARTBEAT_TIMEOUT_SECONDS: 30
    expose:
      - "8000"
    volumes:
      - workspace-data:/workspace-data
      - skills-data:/app/src/skills
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
      runner:
        condition: service_healthy
      temporal:
        condition: service_started

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  event-publisher:
    image: agentsupport-api
    restart: unless-stopped
    command: python -m agentsupport.event_publisher
    environment:
      AGENTSUPPORT_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agentsupport
      AGENTSUPPORT_PERSISTENCE_MODE: postgres
      AGENTSUPPORT_AUTO_CREATE_SCHEMA: "false"
      AGENTSUPPORT_REDIS_URL: redis://redis:6379/0
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  reconciler:
    image: agentsupport-api
    restart: unless-stopped
    command: python -m agentsupport.reconciler
    environment:
      AGENTSUPPORT_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agentsupport
      AGENTSUPPORT_PERSISTENCE_MODE: postgres
      AGENTSUPPORT_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  retention:
    image: agentsupport-api
    restart: unless-stopped
    command: python -m agentsupport.retention
    environment:
      AGENTSUPPORT_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agentsupport
      AGENTSUPPORT_PERSISTENCE_MODE: postgres
      AGENTSUPPORT_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  runner:
    image: agentsupport-api
    restart: unless-stopped
    command: uvicorn session_runner.main:app --host 0.0.0.0 --port 8080
    environment:
      SESSION_RUNNER_MODE: ${SESSION_RUNNER_MODE:-trae}
      SESSION_RUNNER_TOKEN: ${AGENTSUPPORT_RUNNER_TOKEN:-}
      SESSION_RUNNER_ENDPOINT: http://runner:8080
      SESSION_RUNNER_PROVIDER: ${SESSION_RUNNER_MODE:-trae}
      SESSION_RUNNER_VERSION: 0.1.0
      SESSION_RUNNER_HEARTBEAT_SECONDS: 10
      AGENTSUPPORT_CONTROL_PLANE_URL: http://api:8000
      SESSION_RUNNER_TRAE_CONFIG: /app/src/session_runner/trae_config.yaml
      SESSION_RUNNER_WORKSPACE_ROOTS: /workspace,/workspace-data
      TRAE_PROVIDER: ${TRAE_PROVIDER:-anthropic}
      TRAE_API_KEY: ${TRAE_API_KEY:-${ANTHROPIC_AUTH_TOKEN:-}}
      TRAE_MODEL_BASE_URL: ${TRAE_MODEL_BASE_URL:-${ANTHROPIC_BASE_URL:-}}
      TRAE_MODEL_HOST: ${TRAE_MODEL_HOST:-}
      TRAE_MODEL: ${TRAE_MODEL:-claude-sonnet-4-20250514}
      TRAE_MAX_STEPS: ${TRAE_MAX_STEPS:-24}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
    expose:
      - "8080"
    volumes:
      - workspace-data:/workspace-data
      - skills-data:/app/src/skills
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal dev server (phase 0/1 dual-run). Production should use a managed
  # Temporal deployment (Temporal Cloud) or a properly provisioned server.
  temporal:
    image: temporalio/dev-server:latest
    ports:
      - "7233:7233"
    restart: unless-stopped

  # Temporal execution worker: drives run workflows for execution_mode=temporal.
  # The control-plane API runs in the same mode by setting
  # AGENTSUPPORT_EXECUTION_MODE=temporal on the api service.
  temporal-worker:
    image: agentsupport-api
    command: python -m agentsupport.execution.temporal.worker
    restart: unless-stopped
    environment:
      AGENTSUPPORT_PERSISTENCE_MODE: postgres
      AGENTSUPPORT_EXECUTION_MODE: temporal
      AGENTSUPPORT_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agentsupport
      AGENTSUPPORT_TEMPORAL_HOST: temporal:7233
      AGENTSUPPORT_TEMPORAL_NAMESPACE: default
      AGENTSUPPORT_TEMPORAL_TASK_QUEUE: agentsupport
      AGENTSUPPORT_CORE_RUNNER_URL: http://runner:8080
      AGENTSUPPORT_CORE_RUNNER_WORKSPACE_ROOT: /workspace-data
      AGENTSUPPORT_WORKSPACE_ROOT: /workspace-data
      AGENTSUPPORT_SKILLS_ROOT: /app/src/skills
    volumes:
      - workspace-data:/workspace-data
      - skills-data:/app/src/skills
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
      temporal:
        condition: service_started

  demo:
    image: agentsupport-api
    restart: unless-stopped
    command: python /app/demo/demo_server.py
    environment:
      AGENTSUPPORT_DEMO_HOST: 0.0.0.0
      AGENTSUPPORT_DEMO_PORT: "8900"
      AGENTSUPPORT_DEMO_CONTROL_URL: http://gateway:8000
      AGENTSUPPORT_DEMO_RUNNER_URL: http://runner:8080
      AGENTSUPPORT_WORKSPACE_ROOT: /workspace-data
      AGENTSUPPORT_RUNNER_WORKSPACE_ROOT: /workspace-data
      AGENTSUPPORT_SKILLS_ROOT: /app/src/skills
    ports:
      - "8900:8900"
    volumes:
      - workspace-data:/workspace-data
      - skills-data:/app/src/skills
    depends_on:
      gateway:
        condition: service_healthy
      runner:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentsupport
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentsupport"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  workspace-data:
  skills-data:
  redis-data:
