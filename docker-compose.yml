services:
  db-migrate:
    image: agentsupport-api
    command: alembic upgrade head
    environment:
      AGENT_PLATFORM_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_platform
    depends_on:
      postgres:
        condition: service_healthy

  workspace-init:
    image: agentsupport-api
    user: root
    command: ["sh", "-c", "mkdir -p /workspace-data && chown -R agent:agent /workspace-data"]
    volumes:
      - workspace-data:/workspace-data
    restart: "no"

  api:
    image: agentsupport-api
    build: .
    command: uvicorn agent_platform.main:app --host 0.0.0.0 --port 8000
    environment:
      AGENT_PLATFORM_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_platform
      AGENT_PLATFORM_PERSISTENCE_MODE: postgres
      AGENT_PLATFORM_AUTO_CREATE_SCHEMA: "false"
      AGENT_PLATFORM_EXECUTION_MODE: distributed
      AGENT_PLATFORM_REDIS_URL: redis://redis:6379/0
      AGENT_PLATFORM_CORE_RUNNER_URL: http://runner:8080
      AGENT_PLATFORM_CORE_RUNNER_TIMEOUT_SECONDS: 300
      AGENT_PLATFORM_CORE_RUNNER_WORKSPACE_ROOT: /workspace-data
      AGENT_PLATFORM_WORKSPACE_ROOT: /workspace-data
    expose:
      - "8000"
    volumes:
      - workspace-data:/workspace-data
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
      runner:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    image: agentsupport-api
    command: python -m agent_platform.worker
    environment:
      AGENT_PLATFORM_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_platform
      AGENT_PLATFORM_PERSISTENCE_MODE: postgres
      AGENT_PLATFORM_AUTO_CREATE_SCHEMA: "false"
      AGENT_PLATFORM_EXECUTION_MODE: distributed
      AGENT_PLATFORM_RUNTIME_DRIVER: memory
      AGENT_PLATFORM_CORE_RUNNER_URL: http://runner:8080
      AGENT_PLATFORM_CORE_RUNNER_WORKSPACE_ROOT: /workspace-data
      AGENT_PLATFORM_WORKSPACE_ROOT: /workspace-data
      AGENT_PLATFORM_REDIS_URL: redis://redis:6379/0
      AGENT_PLATFORM_MAX_ACTIVE_SESSIONS: 2
    volumes:
      - workspace-data:/workspace-data
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
      runner:
        condition: service_healthy

  event-publisher:
    image: agentsupport-api
    command: python -m agent_platform.event_publisher
    environment:
      AGENT_PLATFORM_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_platform
      AGENT_PLATFORM_PERSISTENCE_MODE: postgres
      AGENT_PLATFORM_AUTO_CREATE_SCHEMA: "false"
      AGENT_PLATFORM_EXECUTION_MODE: distributed
      AGENT_PLATFORM_REDIS_URL: redis://redis:6379/0
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  reconciler:
    image: agentsupport-api
    command: python -m agent_platform.reconciler
    environment:
      AGENT_PLATFORM_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_platform
      AGENT_PLATFORM_PERSISTENCE_MODE: postgres
      AGENT_PLATFORM_AUTO_CREATE_SCHEMA: "false"
      AGENT_PLATFORM_EXECUTION_MODE: distributed
      AGENT_PLATFORM_RUNTIME_DRIVER: memory
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  runner:
    image: agentsupport-api
    command: uvicorn session_runner.main:app --host 0.0.0.0 --port 8080
    environment:
      SESSION_RUNNER_MODE: ${SESSION_RUNNER_MODE:-trae}
      SESSION_RUNNER_TRAE_CONFIG: /app/src/session_runner/trae_config.yaml
      SESSION_RUNNER_WORKSPACE_ROOTS: /workspace,/workspace-data
      TRAE_PROVIDER: ${TRAE_PROVIDER:-anthropic}
      TRAE_API_KEY: ${TRAE_API_KEY:-${ANTHROPIC_AUTH_TOKEN:-}}
      TRAE_MODEL_BASE_URL: ${TRAE_MODEL_BASE_URL:-${ANTHROPIC_BASE_URL:-}}
      TRAE_MODEL: ${TRAE_MODEL:-claude-sonnet-4-20250514}
    expose:
      - "8080"
    volumes:
      - workspace-data:/workspace-data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  workspace-data:
  redis-data:
